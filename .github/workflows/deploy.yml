name: Build and Deploy to AKS

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: flask-demo

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Verify Azure Account
        run: |
          az account show

      - name: Verify Secret Values
        run: |
          echo "ACR_NAME=${{ secrets.ACR_NAME }}"
          echo "AKS_CLUSTER_NAME=${{ secrets.AKS_CLUSTER_NAME }}"
          echo "RESOURCE_GROUP=${{ secrets.RESOURCE_GROUP }}"

      - name: List ACR Registries
        run: |
          az acr list -o table

      - name: Show ACR Details
        run: |
          az acr show --name ${{ secrets.ACR_NAME }}

      - name: Login to ACR
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Set AKS Context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Apply Deployment
        run: |
          kubectl apply -f deployment.yaml

      - name: Update Deployment Image
        run: |
          kubectl set image deployment/flask-demo \
          flask-demo=${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Verify Rollout
        run: |
          kubectl rollout status deployment/flask-demo

      - name: Show Pods
        run: |
          kubectl get pods -o wide